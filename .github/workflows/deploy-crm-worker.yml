name: Deploy worker

# Keeps the hosted Trigger.dev worker and the test database in step with main,
# so the CRM test flow never depends on a developer's computer.
on:
  push:
    branches: [main]
    paths:
      - "apps/crm/trigger/**"
      - "apps/crm/trigger.config.ts"
      - "apps/crm/db/**"
      - "apps/crm/drizzle/**"
      - "apps/crm/lib/crm/policy.ts"
      - "apps/crm/lib/crm/assessment-dispatch.ts"
      - "apps/crm/scripts/migrate-preview.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-crm-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Migrate test database and deploy worker
    # A manual run can pick any branch; production deploys come from main only.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty until live intake is provisioned; the live migration step skips then.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Migrate the test database
        run: pnpm --dir apps/crm exec node --import tsx scripts/migrate-preview.ts
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

      # The live intake database is migrated only once its secret exists, so the
      # workflow keeps working before live intake is provisioned.
      - name: Migrate the live intake database
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --dir apps/crm exec node --import tsx scripts/migrate-intake.ts

      - name: Deploy the worker to Trigger.dev prod
        run: pnpm --dir apps/crm exec trigger deploy --env prod
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
