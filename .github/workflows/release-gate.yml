name: Release gate

# `develop` is the integration branch and deploys to the persistent Vercel
# Preview at phxhomeloancom-dev.vercel.app. `main` is the live site. Only a
# pull request from `develop` (a release) or `hotfix/*` (a hotfix) may merge
# into `main`; the `source` lane below enforces that so a feature branch can
# never reach production by mistake. The owner alone opens and merges them.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CRM_STAFF_EMAILS: ci@example.com
  TEST_EMAIL_ALLOWLIST: ci@example.com
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_STUDIO_URL: ${{ vars.NEXT_PUBLIC_STUDIO_URL }}
  NEXT_PUBLIC_SITE_ENV: production
  NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
  OG_IMAGE_SECRET: ci-only-og-image-secret

# The lanes are independent so the gate finishes when the slowest lane does,
# not when all of them have run back to back.
jobs:
  source:
    # Always runs so the release-gate job sees "success" rather than "skipped".
    name: Only develop or hotfix/* may merge into main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject pull requests into main from any branch except develop or hotfix/*
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then
            # A fork can also have these branch names, so the head repository must match too.
            case "$HEAD" in
              develop | hotfix/?*) allowed=yes ;;
              *) allowed=no ;;
            esac
            if [ "$allowed" != "yes" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::error::Pull requests into main must come from this repository's develop branch or a hotfix/* branch. Retarget this pull request to develop."
              exit 1
            fi
          fi
          echo "ok: $EVENT $HEAD_REPO:$HEAD -> ${BASE:-push}"

  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck and lint affected packages
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm turbo run typecheck lint --affected

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test affected packages
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm turbo run test --affected

  smoke:
    # Vercel already builds every commit; the smoke test runs against that
    # deployment instead of building the site a second time on the runner.
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Each package's smoke test runs against its own Vercel project, so the
      # packages are selected here and run one at a time with their own URL.
      - name: Check which packages with a smoke test changed
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          affected=$(pnpm turbo run test:smoke --affected --dry=json)
          for package in frontend crm; do
            if echo "$affected" | jq -e --arg p "$package" '.tasks | any(.package == $p)' >/dev/null; then
              echo "$package=true" >> "$GITHUB_OUTPUT"
            else
              echo "$package=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Wait for the PHX website Vercel deployment
        id: website-deployment
        if: steps.affected.outputs.frontend == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production – phxhomeloancom-2026' || 'Preview – phxhomeloancom-2026' }}
          DEPLOY_STATUS_CONTEXT: Vercel – phxhomeloancom-2026
        run: |
          url=$(node scripts/wait-for-vercel-deployment.mjs)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run PHX website browser smoke tests
        if: steps.affected.outputs.frontend == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.website-deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm turbo run test:smoke --filter=frontend

      - name: Wait for the CRM Vercel deployment
        id: crm-deployment
        if: steps.affected.outputs.crm == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production – valoansforvets-crm' || 'Preview – valoansforvets-crm' }}
          DEPLOY_STATUS_CONTEXT: Vercel – valoansforvets-crm
        run: |
          url=$(node scripts/wait-for-vercel-deployment.mjs)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Navigates /crm in real Google Chrome. Clerk's browser handshake only
      # runs in a browser, so an invalid CLERK_SECRET_KEY on the deployment
      # fails here and nowhere else in the gate.
      - name: Run CRM browser smoke tests
        if: steps.affected.outputs.crm == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.crm-deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.CRM_VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm turbo run test:smoke --filter=crm

  release-gate:
    # Single stable check name for branch protection. Runs even when a lane
    # fails (a skipped required check would otherwise block or, worse, pass).
    name: Release gate
    runs-on: ubuntu-latest
    needs: [source, static, unit, smoke]
    if: always()
    steps:
      - name: Require every lane to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'length > 0 and all(. == "success")' >/dev/null
